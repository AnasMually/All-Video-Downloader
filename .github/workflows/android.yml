name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Build, test and lint
        run: ./gradlew --stacktrace :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug
      - name: Verify 16 KB native-library alignment
        run: bash scripts/check-elf-alignment.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: all-video-downloader-debug
          path: app/build/outputs/apk/debug/app-debug.apk
