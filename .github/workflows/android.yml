name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  inspect-live-facebook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect deployed resolve and raw yt-dlp audio formats
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://anasmugally.vps.webdock.cloud/VideoDownloader/api/v1'
          URL='https://www.facebook.com/share/v/1BydnA1d1H/'

          curl -fsS --max-time 120 \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg url "$URL" '{url:$url,adaptive_client:true}')" \
            "$BASE/extract.php" > /tmp/extract.json
          DOWNLOAD_ID="$(jq -r '.video.downloads[] | select(.requires_merge == true) | .id' /tmp/extract.json | head -n1)"
          AUDIO_TRACK_ID="$(jq -r '.video.default_audio_track_id // empty' /tmp/extract.json)"
          if [ -n "$AUDIO_TRACK_ID" ]; then
            BODY="$(jq -nc --arg url "$URL" --arg id "$DOWNLOAD_ID" --arg audio "$AUDIO_TRACK_ID" '{url:$url,download_id:$id,audio_track_id:$audio,adaptive_client:true}')"
          else
            BODY="$(jq -nc --arg url "$URL" --arg id "$DOWNLOAD_ID" '{url:$url,download_id:$id,adaptive_client:true}')"
          fi
          curl -fsS --max-time 120 -H 'Content-Type: application/json' --data "$BODY" "$BASE/resolve.php" > /tmp/resolve.json
          echo '=== LIVE RESOLVE AUDIO ==='
          jq '{format_id:.download.audio.format_id,protocol:.download.audio.protocol,filesize:.download.audio.filesize,fragment_base_url:.download.audio.fragment_base_url,fragment_count:(.download.audio.fragments // [] | length),url:.download.audio.url}' /tmp/resolve.json

          python3 -m pip install --quiet --upgrade yt-dlp
          yt-dlp --ignore-config --no-playlist --skip-download --dump-single-json "$URL" > /tmp/raw.json
          echo '=== RAW AUDIO-ONLY FORMATS ==='
          jq '[.formats[] | select((.vcodec // "none") == "none" and (.acodec // "none") != "none") | {format_id,protocol,ext,abr,tbr,filesize,filesize_approx,manifest_url,fragment_base_url,fragment_type:(if has("fragments") then (.fragments|type) else "missing" end),fragment_count:(if (.fragments|type?) == "array" then (.fragments|length) else 0 end),first_fragment:(if (.fragments|type?) == "array" then .fragments[0] else null end),url}]' /tmp/raw.json

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Build, test and lint
        run: ./gradlew --stacktrace :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug
      - name: Verify heavy media/runtime binaries are absent
        run: bash scripts/check-no-heavy-media-binaries.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: all-video-downloader-api-debug
          path: app/build/outputs/apk/debug/app-debug.apk
