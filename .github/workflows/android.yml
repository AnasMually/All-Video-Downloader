name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Apply Facebook merge and progress fixes
        if: github.event_name == 'push'
        run: python3 tools/apply-facebook-progress-fixes.py
      - name: Build, test and lint
        run: ./gradlew --stacktrace :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug
      - name: Verify heavy media/runtime binaries are absent
        run: bash scripts/check-no-heavy-media-binaries.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: all-video-downloader-api-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Commit tested fixes
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- app; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Fix Facebook audio merge and unified download progress"
          git push
