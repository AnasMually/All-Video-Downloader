name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  patch-pr7:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/facebook-fragmented-streams'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/facebook-fragmented-streams
          fetch-depth: 0
      - name: Patch deterministic media handling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/anas_mugally/videodownloader/download/DownloadService.kt')
          text = p.read_text()

          old_retry = '''            } catch (error: Throwable) {
                if (error is CancellationException || requestedStops.containsKey(task.id)) throw error
                if (attempt == 0) {
                    firstError = error
                    delay(500)
                } else {
                    throw error
                }
            }
'''
          new_retry = '''            } catch (error: Throwable) {
                if (error is CancellationException || requestedStops.containsKey(task.id)) throw error
                // Container/media validation failures are deterministic. Re-resolving
                // and downloading the same bytes again only makes progress appear to
                // restart near 90% and wastes the user's bandwidth.
                if (error is InvalidDownloadedMediaException) throw error
                if (attempt == 0) {
                    firstError = error
                    delay(500)
                } else {
                    throw error
                }
            }
'''
          if old_retry not in text:
              raise SystemExit('recovery block not found')
          text = text.replace(old_retry, new_retry, 1)

          old_merge = '''                    val muxAudio = if (
                        audioStream.extension.equals("m4a", true) ||
                        audioStream.extension.equals("mp4", true)
                    ) {
                        audio
                    } else {
                        updateProgress(task.id, 92, speedBytesPerSecond = 0L, etaSeconds = 0L)
                        File(directory, "$NORMALIZED_AUDIO_STEM.m4a").also { normalized ->
                            mediaProcessor.convertToM4a(audio, normalized)
                        }
                    }
'''
          new_merge = '''                    // An .m4a/.mp4 suffix is not a platform-compatibility guarantee.
                    // Facebook can return a valid HE-AAC MP4 that ffmpeg/Media3 can
                    // read while Android MediaExtractor exposes no media samples.
                    // Normalize the companion track locally before MediaMuxer sees it.
                    // This does not perform another network download.
                    updateProgress(task.id, 92, speedBytesPerSecond = 0L, etaSeconds = 0L)
                    val muxAudio = File(directory, "$NORMALIZED_AUDIO_STEM.m4a").also { normalized ->
                        mediaProcessor.convertToM4a(audio, normalized)
                    }
'''
          if old_merge not in text:
              raise SystemExit('mux audio block not found')
          text = text.replace(old_merge, new_merge, 1)

          start_marker = '                    val videoStream = resolved.video ?: error("Video source is unavailable")\n'
          end_marker = '                    val transferredBytes = video.length() + audio.length()\n'
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]
          text = text[:start] + ''.join(
              ('          ' + line) if line.startswith('          ') else line
              for line in block.splitlines(keepends=True)
          ) + text[end:]

          p.write_text(text)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/anas_mugally/videodownloader/download/DownloadService.kt
          git commit -m 'Normalize Facebook companion audio before muxing'
          git push origin HEAD:fix/facebook-fragmented-streams

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Build, test and lint
        run: ./gradlew --stacktrace :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug
      - name: Verify heavy media/runtime binaries are absent
        run: bash scripts/check-no-heavy-media-binaries.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: all-video-downloader-api-debug
          path: app/build/outputs/apk/debug/app-debug.apk
