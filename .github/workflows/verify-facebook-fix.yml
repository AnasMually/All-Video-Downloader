name: Verify Facebook download fix
on:
  push:
    paths:
      - '.github/workflows/verify-facebook-fix.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and lint
        run: ./gradlew --stacktrace :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug
      - name: Verify package size policy
        run: bash scripts/check-no-heavy-media-binaries.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Mark verified
        run: |
          mkdir -p .github/verified
          printf 'Android Facebook download fix verified by build, tests, and lint.\n' > .github/verified/facebook-download-fix.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/verified/facebook-download-fix.txt
          git commit -m "Verify Facebook download fix builds"
          git push
