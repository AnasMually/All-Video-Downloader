name: Verify final download build
on:
  push:
    paths:
      - '.github/workflows/final-download-verification.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test, lint and record result
        shell: bash
        run: |
          set +e
          ./gradlew --stacktrace :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug 2>&1 | tee /tmp/final-build.log
          RC=${PIPESTATUS[0]}
          if [ "$RC" -eq 0 ]; then
            bash scripts/check-no-heavy-media-binaries.sh app/build/outputs/apk/debug/app-debug.apk 2>&1 | tee -a /tmp/final-build.log
            RC=${PIPESTATUS[0]}
          fi
          mkdir -p .github/verified
          if [ "$RC" -eq 0 ]; then
            echo 'SUCCESS' > .github/verified/final-download-build.txt
          else
            echo 'FAILURE' > .github/verified/final-download-build.txt
            echo >> .github/verified/final-download-build.txt
            tail -n 160 /tmp/final-build.log >> .github/verified/final-download-build.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/verified/final-download-build.txt
          git commit -m "Record final download build result"
          git push
          exit "$RC"
