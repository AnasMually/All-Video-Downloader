name: Verify final download build
on:
  push:
    paths:
      - '.github/workflows/final-download-verification.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Diagnose lint
        shell: bash
        run: |
          set +e
          ./gradlew --stacktrace :app:lintDebug 2>&1 | tee /tmp/lint.log
          RC=${PIPESTATUS[0]}
          mkdir -p .github/verified
          if [ "$RC" -eq 0 ]; then
            echo 'LINT_SUCCESS' > .github/verified/android-lint-diagnostic.txt
          else
            echo 'LINT_FAILURE' > .github/verified/android-lint-diagnostic.txt
            echo >> .github/verified/android-lint-diagnostic.txt
            REPORT=$(find app/build -type f \( -name 'lint-results-debug.txt' -o -name 'lint-results-debug.xml' \) | head -n1)
            if [ -n "$REPORT" ]; then
              cat "$REPORT" >> .github/verified/android-lint-diagnostic.txt
            else
              grep -nE 'Error:|Fatal:|error:' /tmp/lint.log | tail -n 80 >> .github/verified/android-lint-diagnostic.txt
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/verified/android-lint-diagnostic.txt
          git commit -m "Record Android lint diagnostic"
          git push
          exit "$RC"
