name: Apply processing retry fix fast
on:
  push:
    paths:
      - '.github/workflows/apply-processing-retry-fix-fast.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch retry scope
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/anas_mugally/videodownloader/download/DownloadService.kt')
          s=p.read_text()
          old='''    private suspend fun createFinalMediaWithRecovery(task: DownloadTask, directory: File): File {
        var firstError: Throwable? = null
        repeat(2) { attempt ->
            try {
                val resolved = api.resolve(task.sourceUrl, task.formatId)
                return createFinalMedia(task, resolved, directory)
            } catch (error: Throwable) {
                if (error is CancellationException || requestedStops.containsKey(task.id)) throw error
                if (attempt == 0) {
                    firstError = error
                    delay(500)
                } else {
                    throw error
                }
            }
        }
        throw firstError ?: IllegalStateException("Unable to resolve download")
    }
'''
          new='''    private suspend fun createFinalMediaWithRecovery(task: DownloadTask, directory: File): File {
        // Only URL resolution is retried. A processing/mux failure must not restart
        // the full media download from the beginning.
        var resolved: ResolvedDownload? = null
        var lastResolveError: Throwable? = null
        for (attempt in 0..1) {
            try {
                resolved = api.resolve(task.sourceUrl, task.formatId)
                break
            } catch (error: Throwable) {
                if (error is CancellationException || requestedStops.containsKey(task.id)) throw error
                lastResolveError = error
                if (attempt == 0) delay(500)
            }
        }
        val selected = resolved ?: throw (lastResolveError ?: IllegalStateException("Unable to resolve download"))
        return createFinalMedia(task, selected, directory)
    }
'''
          if old not in s:
              # If another job already applied it, make this workflow harmless.
              if 'Only URL resolution is retried' in s:
                  raise SystemExit(0)
              raise SystemExit('retry block not found')
          p.write_text(s.replace(old,new,1))
          p=Path('app/build.gradle.kts')
          s=p.read_text()
          if 'versionCode = 15' in s:
              s=s.replace('versionCode = 15','versionCode = 16',1).replace('versionName = "1.6.6"','versionName = "1.6.7"',1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/anas_mugally/videodownloader/download/DownloadService.kt app/build.gradle.kts
          git commit -m 'Avoid redownloading after processing failures' || true
          git push
