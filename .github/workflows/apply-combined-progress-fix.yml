# Final Facebook merged-download progress fix
name: Apply combined download progress fix
on:
  push:
    paths:
      - '.github/workflows/apply-combined-progress-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply progress fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/anas_mugally/videodownloader/download/DownloadService.kt')
          s = p.read_text()

          pattern = re.compile(r'''                    val videoStream = resolved\.video \?: error\("Video source is unavailable"\)\n                    val audioStream = resolved\.audio \?: error\("Audio source is unavailable"\)\n.*?\n                    val transferredBytes = video\.length\(\) \+ audio\.length\(\)''', re.S)
          replacement = '''                    val videoStream = resolved.video ?: error("Video source is unavailable")
                    val audioStream = resolved.audio ?: error("Audio source is unavailable")
                    // Use a byte-accurate combined scale when both stream sizes are
                    // known. If either size is unknown, reserve 0-75% for the video
                    // and 75-90% for companion audio so progress never reaches 90%
                    // after only the first stream and then appears to download again.
                    val expectedTotal = if (videoStream.fileSize != null && audioStream.fileSize != null) {
                        videoStream.fileSize + audioStream.fileSize
                    } else {
                        null
                    }
                    val useAggregateBytes = expectedTotal != null && expectedTotal > 0L
                    if (useAggregateBytes) beginAggregateProgress(task.id, expectedTotal)

                    val video: File
                    val audio: File
                    try {
                        val videoEnd = if (useAggregateBytes) 90 else 75
                        video = downloadStream(task, videoStream, directory, SOURCE_VIDEO_STEM, 0, videoEnd)
                        throwIfStopRequested(task.id)
                        if (useAggregateBytes) aggregateProgressOffsetBytes = video.length()
                        val audioStart = if (useAggregateBytes) 0 else videoEnd
                        audio = downloadStream(task, audioStream, directory, COMPANION_AUDIO_STEM, audioStart, 90)
                        throwIfStopRequested(task.id)
                    } finally {
                        if (useAggregateBytes) endAggregateProgress(task.id)
                    }

                    val transferredBytes = video.length() + audio.length()'''
          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'merged download block replacement count={count}')
          s = s2

          # Remove the previous experimental size-probing helper if an earlier run
          # inserted it. The fixed progress ranges do not need an extra network probe.
          s = re.sub(
              r'''    private fun streamTotalBytes\(stream: MediaStream\): Long\? \{.*?\n    \}\n\n(?=    private fun probeRangeSupport)''',
              '',
              s,
              count=1,
              flags=re.S,
          )
          p.write_text(s)

          p = Path('app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('versionCode = 14', 'versionCode = 15', 1)
          s = s.replace('versionName = "1.6.5"', 'versionName = "1.6.6"', 1)
          p.write_text(s)
          PY

          ./gradlew --stacktrace :app:assembleDebug :app:testDebugUnitTest

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/anas_mugally/videodownloader/download/DownloadService.kt app/build.gradle.kts
          git commit -m 'Keep merged downloads on one progress scale' || true
          git push
