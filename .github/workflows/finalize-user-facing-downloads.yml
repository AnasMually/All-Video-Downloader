name: Finalize user-facing download behavior
on:
  push:
    paths:
      - '.github/workflows/finalize-user-facing-downloads.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/finalize-user-facing-downloads.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Finalize Facebook download progress and user-facing errors"
          git push
