name: Diagnose Facebook fix build
on:
  push:
    paths:
      - '.github/workflows/diagnose-facebook-fix-build.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and capture result
        shell: bash
        run: |
          set +e
          ./gradlew --stacktrace :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug 2>&1 | tee /tmp/build.log
          BUILD_RC=${PIPESTATUS[0]}
          if [ "$BUILD_RC" -eq 0 ]; then
            bash scripts/check-no-heavy-media-binaries.sh app/build/outputs/apk/debug/app-debug.apk 2>&1 | tee -a /tmp/build.log
            BUILD_RC=${PIPESTATUS[0]}
          fi
          mkdir -p .github/verified
          if [ "$BUILD_RC" -eq 0 ]; then
            echo 'SUCCESS' > .github/verified/android-facebook-fix-build.txt
          else
            echo 'FAILURE' > .github/verified/android-facebook-fix-build.txt
            echo >> .github/verified/android-facebook-fix-build.txt
            tail -n 140 /tmp/build.log >> .github/verified/android-facebook-fix-build.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/verified/android-facebook-fix-build.txt
          git commit -m "Record Facebook fix build result"
          git push
          exit "$BUILD_RC"
