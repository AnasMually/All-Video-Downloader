# verify explicit DASH media source support
name: Verify Facebook DASH build
on:
  push:
    paths:
      - '.github/workflows/verify-facebook-dash-build.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        shell: bash
        run: |
          set +e
          ./gradlew --stacktrace :app:assembleDebug :app:testDebugUnitTest > /tmp/build.log 2>&1
          RC=$?
          mkdir -p .github/verified
          if [ "$RC" -eq 0 ]; then
            echo SUCCESS > .github/verified/facebook-dash-build.txt
          else
            echo FAILURE > .github/verified/facebook-dash-build.txt
            tail -n 120 /tmp/build.log >> .github/verified/facebook-dash-build.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/verified/facebook-dash-build.txt
          git commit -m 'Record Facebook DASH build result' || true
          git push || true
          exit "$RC"
