name: Patch Facebook fix branch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/facebook-fragmented-streams' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/facebook-fragmented-streams
          fetch-depth: 0
      - name: Patch DownloadService
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/anas_mugally/videodownloader/download/DownloadService.kt')
          text = p.read_text()

          old = '''            } catch (error: Throwable) {
                if (error is CancellationException || requestedStops.containsKey(task.id)) throw error
                if (attempt == 0) {'''
          new = '''            } catch (error: Throwable) {
                if (error is CancellationException || requestedStops.containsKey(task.id)) throw error
                // Invalid media is deterministic. Retrying the whole transfer only
                // downloads the same broken payload again while the UI is already at 90%.
                if (error is InvalidDownloadedMediaException) throw error
                if (attempt == 0) {'''
          if old in text:
              text = text.replace(old, new, 1)

          old_cache = '            if (adaptiveFile.isFile && adaptiveFile.length() > 0L) return adaptiveFile\n'
          new_cache = '''            // Fragment plans may change when a signed Facebook URL is refreshed.
            // Rebuild fragmented adaptive media from validated fragment parts instead
            // of trusting a stale assembled file from an earlier resolve attempt.
            if (adaptiveFile.isFile && adaptiveFile.length() > 0L && stream.fragments.isEmpty()) return adaptiveFile
'''
          if old_cache in text:
              text = text.replace(old_cache, new_cache, 1)

          marker = '                    val videoStream = resolved.video ?: error("Video source is unavailable")'
          start = text.index(marker)
          end = text.index('                    updateProgress(', start)
          block = text[start:end]
          lines = block.splitlines(keepends=True)
          fixed = []
          for index, line in enumerate(lines):
              if index > 0 and line.startswith('          '):
                  line = '          ' + line
              fixed.append(line)
          text = text[:start] + ''.join(fixed) + text[end:]

          p.write_text(text)
          PY

          git diff --check
          if git diff --quiet; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/anas_mugally/videodownloader/download/DownloadService.kt
          git commit -m 'Harden media recovery and fix lint indentation'
          git push origin HEAD:fix/facebook-fragmented-streams
