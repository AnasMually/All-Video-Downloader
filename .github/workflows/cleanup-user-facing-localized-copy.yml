name: Apply localized end-user copy cleanup
on:
  push:
    paths:
      - '.github/workflows/cleanup-user-facing-localized-copy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update localized copy
        run: python3 tools/cleanup-user-facing-localized-copy.py
      - name: Commit copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res
          git commit -m "Make localized download copy user-facing"
          git push
