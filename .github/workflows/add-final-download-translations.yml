name: Apply final download translations
on:
  push:
    paths:
      - '.github/workflows/add-final-download-translations.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add translations
        run: python3 tools/add-final-download-translations.py
      - name: Commit translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res
          git commit -m "Translate final download status messages"
          git push
