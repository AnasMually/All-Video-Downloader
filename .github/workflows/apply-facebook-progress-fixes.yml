name: Apply Facebook merge and unified progress fixes
on:
  push:
    paths:
      - '.github/workflows/apply-facebook-progress-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        run: python3 tools/apply-facebook-progress-fixes.py
      - name: Build, test and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Fix Facebook audio merge and unified download progress"
          git push
