name: Apply Facebook merge and unified progress fixes
on:
  push:
    paths:
      - '.github/workflows/apply-facebook-progress-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Android fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          service = 'app/src/main/java/com/anas_mugally/videodownloader/download/DownloadService.kt'
          replace_once(service, 'import android.os.PowerManager\n', 'import android.os.PowerManager\nimport android.util.Log\n')
          replace_once(
              service,
              '                    task.copy(status = DownloadStatus.FAILED, error = "Android foreground-service timeout")',
              '                    task.copy(status = DownloadStatus.FAILED, error = getString(com.anas_mugally.videodownloader.R.string.download_failed_user))'
          )

          old_merge = '''                if (resolved.requiresMerge) {
                    val videoStream = resolved.video ?: error("API did not return the video stream")
                    val audioStream = resolved.audio ?: error("API did not return the audio stream")
                    val video = downloadStream(task, videoStream, directory, SOURCE_VIDEO_STEM, 0, 72)
                    throwIfStopRequested(task.id)
                    val audio = downloadStream(task, audioStream, directory, COMPANION_AUDIO_STEM, 72, 88)
                    throwIfStopRequested(task.id)
                    val muxAudio = if (
                        audioStream.extension.equals("m4a", true) ||
                        audioStream.extension.equals("mp4", true)
                    ) {
                        audio
                    } else {
                        updateProgress(task.id, 90)
                        File(directory, "$NORMALIZED_AUDIO_STEM.m4a").also { normalized ->
                            mediaProcessor.convertToM4a(audio, normalized)
                        }
                    }
                    throwIfStopRequested(task.id)
                    updateProgress(task.id, 95)
                    val output = File(directory, DownloadFormatTools.outputFileName(task, "mp4"))
                    mediaProcessor.muxMp4(video, muxAudio, output) { requestedStops.containsKey(task.id) }
                    updateProgress(task.id, 99)
                    output
                } else {'''
          new_merge = '''                if (resolved.requiresMerge) {
                    val videoStream = resolved.video ?: error("Video source is unavailable")
                    val audioStream = resolved.audio ?: error("Audio source is unavailable")
                    val expectedTotal = resolved.fileSize
                        ?: if (videoStream.fileSize != null && audioStream.fileSize != null) {
                            videoStream.fileSize + audioStream.fileSize
                        } else {
                            null
                        }
                    if (expectedTotal != null) {
                        updateProgress(task.id, 0, 0L, expectedTotal, 0L, null)
                    }

                    val video = downloadStream(
                        task = task,
                        stream = videoStream,
                        directory = directory,
                        outputStem = SOURCE_VIDEO_STEM,
                        progressStart = 0,
                        progressEnd = 90,
                        byteOffset = 0L,
                        aggregateTotal = expectedTotal,
                    )
                    throwIfStopRequested(task.id)

                    val videoBytes = video.length().coerceAtLeast(0L)
                    val effectiveTotal = expectedTotal
                        ?: audioStream.fileSize?.let { videoBytes + it }
                    val audio = downloadStream(
                        task = task,
                        stream = audioStream,
                        directory = directory,
                        outputStem = COMPANION_AUDIO_STEM,
                        progressStart = 0,
                        progressEnd = 90,
                        byteOffset = videoBytes,
                        aggregateTotal = effectiveTotal,
                    )
                    throwIfStopRequested(task.id)

                    val transferredBytes = video.length() + audio.length()
                    updateProgress(
                        task.id,
                        90,
                        transferredBytes,
                        effectiveTotal ?: transferredBytes,
                        0L,
                        0L,
                    )
                    val muxAudio = if (
                        audioStream.extension.equals("m4a", true) ||
                        audioStream.extension.equals("mp4", true)
                    ) {
                        audio
                    } else {
                        updateProgress(task.id, 92, speedBytesPerSecond = 0L, etaSeconds = 0L)
                        File(directory, "$NORMALIZED_AUDIO_STEM.m4a").also { normalized ->
                            mediaProcessor.convertToM4a(audio, normalized)
                        }
                    }
                    throwIfStopRequested(task.id)
                    updateProgress(task.id, 95, speedBytesPerSecond = 0L, etaSeconds = 0L)
                    val output = File(directory, DownloadFormatTools.outputFileName(task, "mp4"))
                    mediaProcessor.muxMp4(video, muxAudio, output) { requestedStops.containsKey(task.id) }
                    updateProgress(task.id, 99, speedBytesPerSecond = 0L, etaSeconds = 0L)
                    output
                } else {'''
          replace_once(service, old_merge, new_merge)

          replace_once(
              service,
              '''        progressStart: Int,
        progressEnd: Int,
    ): File {''',
              '''        progressStart: Int,
        progressEnd: Int,
        byteOffset: Long = 0L,
        aggregateTotal: Long? = null,
    ): File {'''
          )

          replace_once(
              service,
              '''            updateProgress(
                task.id,
                progressEnd,
                adaptiveFile.length(),
                adaptiveFile.length(),
                0L,
                0L,
            )''',
              '''            val combinedDownloaded = byteOffset + adaptiveFile.length()
            updateProgress(
                task.id,
                progressEnd,
                combinedDownloaded,
                aggregateTotal ?: combinedDownloaded,
                0L,
                0L,
            )'''
          )

          replace_once(
              service,
              '''                        progressStart = progressStart,
                        progressEnd = progressEnd,
                    )''',
              '''                        progressStart = progressStart,
                        progressEnd = progressEnd,
                        byteOffset = byteOffset,
                        aggregateTotal = aggregateTotal,
                    )'''
          )
          replace_once(
              service,
              '''                        progressStart = progressStart,
                        progressEnd = progressEnd,
                    )
                }
            }
        }

        return downloadStreamSingle(''',
              '''                        progressStart = progressStart,
                        progressEnd = progressEnd,
                        byteOffset = byteOffset,
                        aggregateTotal = aggregateTotal,
                    )
                }
            }
        }

        return downloadStreamSingle('''
          )
          replace_once(
              service,
              '''            progressStart = progressStart,
            progressEnd = progressEnd,
        )
    }

    private suspend fun downloadStreamSingle(''',
              '''            progressStart = progressStart,
            progressEnd = progressEnd,
            byteOffset = byteOffset,
            aggregateTotal = aggregateTotal,
        )
    }

    private suspend fun downloadStreamSingle('''
          )

          replace_once(
              service,
              '''        progressStart: Int,
        progressEnd: Int,
    ): File {
        var existing = partial.length().coerceAtLeast(0L)''',
              '''        progressStart: Int,
        progressEnd: Int,
        byteOffset: Long,
        aggregateTotal: Long?,
    ): File {
        var existing = partial.length().coerceAtLeast(0L)'''
          )
          replace_once(
              service,
              '''                                progressStart = progressStart,
                                progressEnd = progressEnd,
                            )''',
              '''                                progressStart = progressStart,
                                progressEnd = progressEnd,
                                byteOffset = byteOffset,
                                aggregateTotal = aggregateTotal,
                            )'''
          )
          replace_once(
              service,
              '''        updateProgress(
            task.id,
            progressEnd,
            finalFile.length(),
            total ?: finalFile.length(),
            0L,
            0L,
        )''',
              '''        val combinedDownloaded = byteOffset + finalFile.length()
        updateProgress(
            task.id,
            progressEnd,
            combinedDownloaded,
            aggregateTotal ?: (byteOffset + (total ?: finalFile.length())),
            0L,
            0L,
        )'''
          )

          replace_once(
              service,
              '''        segmentCount: Int,
        progressStart: Int,
        progressEnd: Int,
    ): File = coroutineScope {''',
              '''        segmentCount: Int,
        progressStart: Int,
        progressEnd: Int,
        byteOffset: Long,
        aggregateTotal: Long?,
    ): File = coroutineScope {'''
          )
          replace_once(
              service,
              '''                    progressStart = progressStart,
                    progressEnd = progressEnd,
                )''',
              '''                    progressStart = progressStart,
                    progressEnd = progressEnd,
                    byteOffset = byteOffset,
                    aggregateTotal = aggregateTotal,
                )'''
          )
          replace_once(
              service,
              '''        updateProgress(task.id, progressEnd, total, total, 0L, 0L)
        finalFile''',
              '''        updateProgress(
            task.id,
            progressEnd,
            byteOffset + total,
            aggregateTotal ?: (byteOffset + total),
            0L,
            0L,
        )
        finalFile'''
          )

          replace_once(
              service,
              '''        progressStart: Int,
        progressEnd: Int,
    ) {
        val localPercent = if (total != null && total > 0L) {
            ((downloaded * 100.0) / total).roundToInt().coerceIn(0, 100)
        } else {
            0
        }
        val percent = progressStart +
            ((progressEnd - progressStart) * localPercent / 100f).roundToInt()
        val eta = if (total != null && speed > 0L) {
            ((total - downloaded).coerceAtLeast(0L) / speed)
        } else {
            null
        }
        updateProgress(taskId, percent, downloaded, total, speed, eta)
    }''',
              '''        progressStart: Int,
        progressEnd: Int,
        byteOffset: Long = 0L,
        aggregateTotal: Long? = null,
    ) {
        val effectiveDownloaded = byteOffset + downloaded
        val effectiveTotal = aggregateTotal ?: total?.let { byteOffset + it }
        val localPercent = if (effectiveTotal != null && effectiveTotal > 0L) {
            ((effectiveDownloaded * 100.0) / effectiveTotal).roundToInt().coerceIn(0, 100)
        } else if (total != null && total > 0L) {
            ((downloaded * 100.0) / total).roundToInt().coerceIn(0, 100)
        } else {
            0
        }
        val percent = progressStart +
            ((progressEnd - progressStart) * localPercent / 100f).roundToInt()
        val eta = if (effectiveTotal != null && speed > 0L) {
            ((effectiveTotal - effectiveDownloaded).coerceAtLeast(0L) / speed)
        } else {
            null
        }
        updateProgress(taskId, percent, effectiveDownloaded, effectiveTotal, speed, eta)
    }'''
          )

          replace_once(
              service,
              '''    private fun readableError(error: Throwable): String = error.message
        ?.lineSequence()
        ?.lastOrNull { it.isNotBlank() }
        ?.trim()
        ?.take(MAX_ERROR_LENGTH)
        ?: error::class.java.simpleName''',
              '''    private fun readableError(error: Throwable): String {
        Log.e("DownloadService", "Download failed", error)
        return getString(com.anas_mugally.videodownloader.R.string.download_failed_user)
    }'''
          )

          # Processing state: after network transfer finishes, keep one progress
          # bar and tell the user that the final file is being prepared.
          replace_once(
              'app/src/main/java/com/anas_mugally/videodownloader/download/DownloadProgressText.kt',
              '''    fun primary(context: Context, task: DownloadTask): String {
        val downloaded = task.downloadedBytes
        val total = task.totalBytes
        return if (downloaded != null && total != null && total > 0L) {''',
              '''    fun primary(context: Context, task: DownloadTask): String {
        if (task.progress >= 90 && (task.speedBytesPerSecond ?: 0L) <= 0L) {
            return context.getString(R.string.processing_media, task.progress)
        }
        val downloaded = task.downloadedBytes
        val total = task.totalBytes
        return if (downloaded != null && total != null && total > 0L) {'''
          )
          replace_once(
              'app/src/main/java/com/anas_mugally/videodownloader/download/DownloadProgressText.kt',
              '''    fun secondary(context: Context, task: DownloadTask): String? {
        val speed = task.speedBytesPerSecond''',
              '''    fun secondary(context: Context, task: DownloadTask): String? {
        if (task.progress >= 90 && (task.speedBytesPerSecond ?: 0L) <= 0L) return null
        val speed = task.speedBytesPerSecond'''
          )

          # Do not surface API/internal identifiers or stack-level error text.
          replace_once(
              'app/src/main/java/com/anas_mugally/videodownloader/ui/MainViewModel.kt',
              '''                repository.updateTask(task.id) { saved ->
                    saved.copy(status = DownloadStatus.FAILED, error = error.message?.take(240))
                }''',
              '''                repository.updateTask(task.id) { saved ->
                    saved.copy(status = DownloadStatus.FAILED, error = app.getString(R.string.download_failed_user))
                }'''
          )
          replace_once(
              'app/src/main/java/com/anas_mugally/videodownloader/ui/MainViewModel.kt',
              '''    private fun userFacingError(error: Throwable): String {
        if (error is IllegalArgumentException) return app.getString(R.string.invalid_url)
        val technical = when (error) {
            is ApiException -> error.code
            else -> error.message
        }?.lineSequence()?.lastOrNull { it.isNotBlank() }?.trim()?.take(240)
        return if (technical.isNullOrBlank()) app.getString(R.string.analysis_failed)
        else app.getString(R.string.analysis_failed_with_reason, technical)
    }''',
              '''    private fun userFacingError(error: Throwable): String {
        if (error is IllegalArgumentException) return app.getString(R.string.invalid_url)
        return app.getString(R.string.analysis_failed)
    }'''
          )

          # Consumer-facing strings only.
          for path, processing, failed, merge, m4a, preparing in [
              ('app/src/main/res/values/strings.xml',
               'Processing media… %1$d%%',
               'Could not finish this download. Please retry or choose another quality.',
               'Video and audio will be combined automatically.',
               'Audio will be saved as M4A when conversion is needed.',
               'Preparing download…'),
              ('app/src/main/res/values-ar/strings.xml',
               'جارٍ تجهيز الملف… %1$d%%',
               'تعذر إكمال التنزيل. حاول مرة أخرى أو اختر جودة أخرى.',
               'سيتم دمج الفيديو والصوت تلقائيًا.',
               'سيُحفظ الصوت بصيغة M4A عند الحاجة إلى التحويل.',
               'جارٍ تجهيز التنزيل…'),
          ]:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              anchor = '    <string name="waiting_for_wifi">'
              if 'name="processing_media"' not in text:
                  text = text.replace(anchor, f'    <string name="processing_media">{processing}</string>\n    <string name="download_failed_user">{failed}</string>\n' + anchor, 1)
              text = re_sub = text
              if path.endswith('/values/strings.xml'):
                  text = text.replace('Compatible audio will be downloaded and merged on-device', merge)
                  text = text.replace('Audio is converted on-device to M4A (AAC) with Google Media3. FFmpeg is not included.', m4a)
                  text = text.replace('Preparing the on-device download engine…', preparing)
              else:
                  text = text.replace('سيُنزل صوت متوافق ويُدمج داخل الهاتف', merge)
                  text = text.replace('يُحوّل الصوت داخل الهاتف إلى M4A ‏(AAC) عبر Google Media3. لا يتضمن التطبيق FFmpeg.', m4a)
                  text = text.replace('جارٍ تجهيز محرك التنزيل داخل الجهاز…', preparing)
              p.write_text(text, encoding='utf-8')

          replace_once('app/build.gradle.kts', 'versionCode = 11\n        versionName = "1.6.2"', 'versionCode = 12\n        versionName = "1.6.3"')

      - name: Build, test and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Fix Facebook audio merge and unified download progress"
          git push
